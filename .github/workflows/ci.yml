name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  package:
    # A wheel that builds but cannot be imported from a clean environment is
    # the classic packaging failure, so install the built artifact rather
    # than the source tree and import it from a different directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Install the wheel and import it
        run: |
          pip install dist/*.whl
          cd /tmp
          python -c "import mangograd; print(mangograd.__all__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
