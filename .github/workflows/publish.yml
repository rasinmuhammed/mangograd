name: Publish to PyPI

# Runs only when a version tag is pushed, so a release is a deliberate act
# rather than a side effect of merging to main.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity directly,
      # so no long-lived API token has to be stored as a secret.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test before publishing
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"
          pytest -q

      - name: Build
        run: python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
